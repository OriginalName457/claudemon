name: Plugin Scanner

# HOL AI Plugin Scanner — security & quality checks for the Claudemon plugin.
# Runs on GitHub's CI only. Read-only: no secrets, no tokens, contents:read.
# Action pinned to a commit SHA (v1.2.518) rather than a floating tag.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@71874f7686eeb808af573bc74d9cda333707f08d # v1.2.742
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
