name: Plugin Scanner

# HOL AI Plugin Scanner — security & quality checks for the Claudemon plugin.
# Runs on GitHub's CI only. Read-only: no secrets, no tokens, contents:read.
# Action pinned to a commit SHA (v1.2.518) rather than a floating tag.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@9039bbe1164fb39aa410e65d3e90a400c464b081 # v1.2.518
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
