<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style id="cb-boot">html{background:#e6d2b6}body{visibility:hidden}</style>
  <title>Claudémon — Emotes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%98%8A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/pixel.css?v=1" />
  <style>
    :root{ --bg:#fff6ec; --panel:#fff; --ink:#3a2617; --dim:#b07d4e; --accent:#f5793b; --line:#f4d3ac; --edge:#c25e2a; --good:#2a9d5a; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--ink); }
    nav{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; margin:6px 0 4px; }
    nav a{ font-weight:700; font-size:9px; text-decoration:none; color:var(--dim); background:#fff; padding:4px 5px; border:2px solid var(--edge); box-shadow:2px 2px 0 var(--edge); }
    nav a.on{ background:var(--accent); color:#fff; }
    #app{ display:flex; flex-direction:column; height:100%; padding:4px 10px 10px; min-height:0; }
    #pager{ display:flex; align-items:center; justify-content:center; gap:12px; margin:2px 0 4px; }
    #pager button{ font-family:var(--font-body); font-weight:700; font-size:14px; cursor:pointer; color:#fff; background:var(--accent); border:3px solid var(--edge); box-shadow:2px 2px 0 var(--edge); width:32px; height:28px; }
    #pager button:active{ transform:translate(2px,2px); box-shadow:0 0 0; }
    #counter{ font-family:var(--font-title); font-size:10px; color:var(--edge); min-width:74px; text-align:center; }

    #stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:0; position:relative; }
    #sprwrap{ position:relative; width:170px; height:150px; display:flex; align-items:flex-end; justify-content:center; }
    #spr{ image-rendering:pixelated; }
    #pop{ position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:30px; opacity:0; pointer-events:none; }
    #pop.go{ animation:pop 2.6s ease-out; }
    @keyframes pop{ 0%{ opacity:0; transform:translateX(-50%) translateY(6px) scale(.5);} 12%{ opacity:1; transform:translateX(-50%) translateY(-4px) scale(1.15);} 30%{ transform:translateX(-50%) translateY(-10px) scale(1);} 80%{ opacity:1; } 100%{ opacity:0; transform:translateX(-50%) translateY(-22px) scale(.9);} }

    .nm{ font-family:var(--font-title); font-size:13px; color:var(--edge); }
    .feel{ font-family:var(--font-body); font-weight:700; font-size:10px; color:var(--dim); letter-spacing:.5px; text-transform:uppercase; }
    .line{ font-size:13px; text-align:center; max-width:300px; min-height:38px; line-height:1.4; background:#fffbe6; border:3px solid var(--edge); padding:7px 11px; }
    .dots{ display:flex; gap:7px; margin-top:2px; }
    .dot{ font-size:15px; cursor:pointer; opacity:.4; filter:grayscale(.6); }
    .dot.on{ opacity:1; filter:none; transform:scale(1.25); }
    .hint{ font-size:9px; color:var(--dim); margin-top:2px; }

    /* ---- the animation vocabulary (matches emotes.js anim cues) ---- */
    .a-bounce{ animation:bounce .6s ease; } @keyframes bounce{ 0%,100%{transform:translateY(0)} 30%{transform:translateY(-14px)} 55%{transform:translateY(0)} 70%{transform:translateY(-6px)} }
    .a-hop{ animation:hop .5s ease; } @keyframes hop{ 0%{transform:translateY(0)} 25%{transform:translateY(-20px)} 45%{transform:translateY(0)} 60%{transform:translateY(-9px)} 80%{transform:translateY(0)} }
    .a-wiggle{ animation:wiggle .6s ease; } @keyframes wiggle{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-9deg)} 45%{transform:rotate(8deg)} 70%{transform:rotate(-5deg)} }
    .a-spin{ animation:spin .7s ease; } @keyframes spin{ to{transform:rotate(360deg)} }
    .a-pulse{ animation:pulse .7s ease; } @keyframes pulse{ 0%,100%{transform:scale(1)} 40%{transform:scale(1.14)} }
    .a-sway{ animation:sway 1.2s ease; } @keyframes sway{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(5deg)} 75%{transform:rotate(-5deg)} }
    .a-flop{ animation:flop .8s ease; } @keyframes flop{ 0%{transform:rotate(0)} 60%{transform:rotate(14deg) translateY(6px)} 100%{transform:rotate(9deg) translateY(4px)} }
    .a-shimmer{ animation:shimmer 1s ease; } @keyframes shimmer{ 0%,100%{opacity:1;transform:translateX(0)} 20%{opacity:.5;transform:translateX(-3px)} 50%{opacity:1;transform:translateX(3px)} 75%{opacity:.6} }
    .a-flick{ animation:flick .4s ease; } @keyframes flick{ 0%,100%{transform:rotate(0)} 40%{transform:rotate(-12deg)} }
    .a-glow{ animation:glow 1.1s ease; } @keyframes glow{ 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 8px #ffd36a) brightness(1.15)} }
    .a-droop{ animation:droop 1.1s ease; } @keyframes droop{ 0%{transform:translateY(0) rotate(0)} 100%{transform:translateY(7px) rotate(4deg)} }
    .a-shake{ animation:shake .4s ease; } @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
    .a-puff{ animation:puff .6s ease; } @keyframes puff{ 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1.05)} }
  </style>
  <link rel="stylesheet" href="/device.css?v=18" />
  <script src="/device.js?v=19" defer></script>
</head>
<body>
  <div id="app">
    <nav><a href="/">🦀 Tank</a><a href="/den.html">🏠 Den</a><a href="/shop.html">🛒 Shop</a><a href="/lab.html">🧪 Lab</a><a href="/lounge.html">💬 Lounge</a><a href="/dex.html">📖 Dex</a><a href="/emotes.html" class="on">😊 Emotes</a></nav>
    <div id="pager"><button id="prev">◀</button><span id="counter">— / —</span><button id="next">▶</button></div>
    <div id="stage">
      <div id="sprwrap"><div id="pop"></div><canvas id="spr" width="150" height="150"></canvas></div>
      <div class="nm" id="name">—</div>
      <div class="feel" id="feel">—</div>
      <div class="line" id="line">…</div>
      <div class="dots" id="dots"></div>
      <div class="hint">tap the creature to react · ◀ ▶ to browse the crew</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const FEEL_ICON = { happy: '😊', excited: '🤩', proud: '😤', love: '💗', sleepy: '😴', curious: '🤔' };
    let LIST = [], ci = 0, feels = [], fi = 0, timer = null;
    let port = null;   // sprite animation state

    (async () => {
      const spd = await (await fetch('/api/species')).json();
      LIST = spd.species.filter((s) => s.emotes && s.faction === 'friendly');
      if (!LIST.length) LIST = spd.species.filter((s) => s.emotes);
      show(0);
    })();

    function show(i) {
      ci = (i + LIST.length) % LIST.length;
      const sp = LIST[ci];
      $('counter').textContent = (ci + 1) + ' / ' + LIST.length;
      $('name').textContent = sp.emoji + ' ' + sp.name;
      feels = Object.keys(sp.emotes); fi = 0;
      $('dots').innerHTML = feels.map((f, k) => `<span class="dot" data-i="${k}">${FEEL_ICON[f] || '•'}</span>`).join('');
      $('dots').querySelectorAll('.dot').forEach((d) => d.addEventListener('click', () => { fi = +d.dataset.i; playFeel(); resetTimer(); }));
      startSprite(sp);
      playFeel();
      resetTimer();
    }

    let idle = null;
    function mkPort(img, fw, fh, fr, fps) {
      const c = $('spr'); const scale = Math.min(2.7, 120 / fw);
      const dw = fw * scale, dh = fh * scale, dx = (c.width - dw) / 2, dy = c.height - dh;
      return { c, ctx: c.getContext('2d'), img, fw, fh, fr, fps, dw, dh, dx, dy, f: 0, last: 0, ok: () => img.complete && img.naturalWidth > 0 };
    }
    function startSprite(sp) {
      const meta = sp.sprite || { frameW: 48, frameH: 48, frames: 1, fps: 8 };
      const img = new Image(); img.src = '/assets/' + (meta.sheet || sp.id + '.png') + '?v=' + Date.now();
      idle = mkPort(img, meta.frameW || 48, meta.frameH || 48, meta.frames || 1, meta.fps || 8);
      port = idle;
      if (!startSprite._loop) { startSprite._loop = true; requestAnimationFrame(spriteLoop); }
    }
    function playFeel() {
      const sp = LIST[ci]; const f = feels[fi]; const e = sp.emotes[f];
      $('feel').textContent = (FEEL_ICON[f] || '') + ' ' + f + (sp._real && sp._real[f] ? '  · real ✨' : '');
      $('line').textContent = e.line;
      $('dots').querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === fi));
      const pop = $('pop'); pop.textContent = e.emote; pop.classList.remove('go'); void pop.offsetWidth; pop.classList.add('go');
      const c = $('spr');
      // play the REAL generated animation if this creature+emotion has one; else
      // fall back to the idle sprite + a CSS motion cue.
      const anim = new Image();
      anim.onload = () => { if (LIST[ci] !== sp || feels[fi] !== f) return; sp._real = sp._real || {}; sp._real[f] = 1; c.className = ''; const fh = 48, fr = Math.max(1, Math.round(anim.naturalWidth / fh)); port = mkPort(anim, fh, fh, fr, 11); $('feel').textContent = (FEEL_ICON[f] || '') + ' ' + f + '  · real ✨'; };
      anim.onerror = () => { if (LIST[ci] !== sp || feels[fi] !== f) return; port = idle; c.className = ''; void c.offsetWidth; c.classList.add('a-' + (e.anim || 'bounce')); };
      anim.src = '/assets/' + sp.id + '_' + f + '.png?v=' + Date.now();
    }
    function nextFeel() { fi = (fi + 1) % feels.length; playFeel(); }
    function resetTimer() { clearInterval(timer); timer = setInterval(nextFeel, 2800); }

    function spriteLoop(now) {
      const p = port;
      if (p && p.ok()) {
        p.ctx.imageSmoothingEnabled = false; p.ctx.clearRect(0, 0, p.c.width, p.c.height);
        if (now - p.last >= 1000 / p.fps) { p.f = (p.f + 1) % p.fr; p.last = now; }
        p.ctx.drawImage(p.img, (p.f % p.fr) * p.fw, 0, p.fw, p.fh, p.dx, p.dy, p.dw, p.dh);
      }
      requestAnimationFrame(spriteLoop);
    }

    $('prev').addEventListener('click', () => show(ci - 1));
    $('next').addEventListener('click', () => show(ci + 1));
    $('sprwrap').addEventListener('click', () => { nextFeel(); resetTimer(); });
    window.addEventListener('cb-nav', (e) => { if (e.detail === 'left') { e.preventDefault(); show(ci - 1); } else if (e.detail === 'right') { e.preventDefault(); show(ci + 1); } });
    window.addEventListener('cb-a', (e) => { e.preventDefault(); nextFeel(); resetTimer(); });
  </script>
</body>
</html>
