<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Clawde — Mood Faces</title>
<style>
  body{margin:0;background:radial-gradient(120% 100% at 50% 0%,#14213f,#0a1226 70%);color:#eaf0ff;
    font-family:"Courier New",monospace;min-height:100vh;padding:28px 16px;text-align:center;}
  h1{letter-spacing:3px;color:#3ac0a0;font-size:22px;margin:4px;}
  .sub{color:#8fa0cf;font-size:13px;margin-bottom:26px;}
  .row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;}
  .card{background:#131a36;border:2px solid #26305a;border-bottom-width:5px;border-radius:14px;padding:16px;width:200px;}
  .card h2{font-size:15px;margin:0 0 8px;}
  .stage{background:#08122b;border:2px solid #1d2748;border-radius:10px;height:180px;display:flex;align-items:center;justify-content:center;}
  .stage canvas,.stage img{image-rendering:pixelated;width:140px;height:140px;}
  .cap{font-size:11px;color:#8fa0cf;margin-top:8px;}
  .pending{opacity:.5;border-style:dashed;}
</style></head>
<body>
  <h1>🦀 CLAWDE'S MOODS</h1>
  <div class="sub">his face changes with his stats</div>
  <div class="row">
    <div class="card"><h2>😊 Happy (idle)</h2><div class="stage"><canvas id="idle" width="48" height="48"></canvas></div>
      <div class="cap">when well cared-for · animated</div></div>
    <div class="card"><h2>🍖 Hungry</h2><div class="stage"><img src="/assets/clawde_hungry.png?v=1"></div>
      <div class="cap">low fullness / thirst</div></div>
    <div class="card"><h2>😴 Sleepy</h2><div class="stage"><img src="/assets/clawde_sleepy.png?v=1"></div>
      <div class="cap">low energy</div></div>
    <div class="card pending"><h2>😢 Sad</h2><div class="stage" style="color:#5f6b96;font-size:12px">out of trial gens<br>(needs top-up)</div>
      <div class="cap">falls back to idle for now</div></div>
  </div>
<script>
(async()=>{
  const man=await (await fetch('/assets/manifest.json?v='+Date.now())).json();
  const st=man.creature.states.idle;const img=new Image();img.src='/assets/'+st.sheet+'?v='+Date.now();
  await new Promise(r=>img.onload=r);
  const cx=document.getElementById('idle').getContext('2d');cx.imageSmoothingEnabled=false;let c=0;
  setInterval(()=>{cx.clearRect(0,0,48,48);cx.drawImage(img,(c%st.frames)*48,0,48,48,0,0,48,48);c++;},1000/(st.fps||8));
})();
</script>
</body></html>
